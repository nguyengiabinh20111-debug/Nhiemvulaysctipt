<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>📜 Script — Nhận Ngay</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Arial, sans-serif}
        body{
            background: #f9f6ed;
            min-height:100vh;
            padding:20px
        }
        .container{max-width:520px;margin:0 auto}
        
        .script-header{
            background: linear-gradient(135deg, #fff 0%, #fff9e6 100%);
            border-radius:20px;
            padding:25px;
            margin-bottom:20px;
            text-align:center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border: 1px solid #f0e9d2;
        }
        .script-icon{font-size:40px;margin-bottom:10px}
        .script-name{
            font-size:26px;font-weight:800;
            color: #b8860b;
            margin-bottom:8px;
        }
        .script-desc{color:#888;font-size:14px;line-height:1.6}
        
        .card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 2px 12px rgba(0,0,0,0.05);margin-bottom:20px;border:1px solid #f0e9d2}
        
        .code-box{
            background:#1e1e1e;color:#d4d4d4;padding:20px;border-radius:14px;
            font-family:monospace;font-size:13px;line-height:1.6;
            white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;margin:15px 0
        }
        
        .copy-btn{
            width:100%;padding:16px;background:linear-gradient(90deg,#ffc107,#ff9800);
            color:#222;font-weight:bold;border:none;border-radius:14px;font-size:16px;cursor:pointer;
            transition:all 0.3s;box-shadow:0 3px 10px rgba(255,193,7,0.3)}
        .copy-btn:active{transform:scale(0.97)}
        .copy-btn.done{background:linear-gradient(90deg,#2563eb,#3b82f6)}
        
        .support-box{
            background:linear-gradient(135deg,#fff9e6,#fff8f0);
            border-radius:20px;padding:25px;border:2px solid #ffc107;
            box-shadow:0 2px 12px rgba(0,0,0,0.05);text-align:center;margin-top:10px
        }
        .support-box h3{color:#b8860b;font-size:17px;margin-bottom:10px}
        .support-box p{font-size:14px;line-height:1.8;color:#555}
    </style>
</head>
<body>
    <div class="container">
        
        <div class="script-header">
            <div class="script-icon">🎉</div>
            <h1 class="script-name" id="pageName">CHÚC MỪNG!</h1>
            <p class="script-desc">Bạn đã hoàn thành nhiệm vụ<br>Dưới đây là script của bạn — sử dụng vui vẻ nhé!</p>
        </div>

        <div class="card">
            <div class="code-box" id="scriptDisplay">Đang tải...</div>
            <button class="copy-btn" id="copyBtn" onclick="copyScript()">📋 SAO CHÉP SCRIPT NGAY</button>
        </div>

        <div class="support-box">
            <h3>💖 ỦNG HỘ MÌNH NỮA NHA!</h3>
            <p>Cảm ơn bạn đã tin dùng ❤️</p>
            <p>Nếu thấy hay, hãy giới thiệu cho bạn bè cùng biết<br>Đó là động lực lớn để mình tạo ra nhiều thứ tốt hơn 💪</p>
            <p style="margin-top:10px;font-weight:bold;color:#b8860b">Chúc bạn chơi game vui vẻ! 🎮✨</p>
        </div>
    </div>

<script>
window.onload = function(){
    const p = new URLSearchParams(window.location.search);
    let data = p.get("data");
    let name = p.get("name") || "Script";
    
    document.getElementById('pageName').innerText = name;
    
    if(!data){
        document.getElementById('scriptDisplay').innerText = "❌ Không tìm thấy nội dung Script!\nVui lòng tạo lại từ trang quản lý.";
        return;
    }
    
    try{
        const decoded = decodeURIComponent(escape(atob(data)));
        document.getElementById('scriptDisplay').innerText = decoded;
    }catch(e){
        document.getElementById('scriptDisplay').innerText = "❌ Lỗi hiển thị nội dung!";
    }
};

function copyScript(){
    const text = document.getElementById('scriptDisplay').innerText;
    navigator.clipboard.writeText(text).then(()=>{
        const btn = document.getElementById('copyBtn');
        btn.classList.add('done');
        btn.innerText = "✅ ĐÃ SAO CHÉP THÀNH CÔNG!";
        setTimeout(()=>{
            btn.classList.remove('done');
            btn.innerText = "📋 SAO CHÉP SCRIPT NGAY";
        }, 3000);
    });
}
</script>
</body>
</html>
