<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tạo Link Script</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#f5f5f7;color:#333;min-height:100vh;padding:30px}
        .box{max-width:550px;margin:0 auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 2px 15px rgba(0,0,0,0.08)}
        h1{color:#ff4444;text-align:center;margin-bottom:25px;font-size:22px}
        
        .pass-wrap{position:relative;margin:8px 0}
        input, textarea{width:100%;padding:14px;padding-right:45px;border:1px solid #ddd;border-radius:10px;font-size:15px}
        .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;padding:0}
        
        .check-row{display:flex;align-items:center;gap:8px;margin:10px 0 15px;cursor:pointer}
        .check-row input{width:auto;margin:0}
        .check-row label{font-size:14px;color:#555;cursor:pointer}
        
        .tab-wrap{display:flex;margin-bottom:20px;border-bottom:2px solid #eee}
        .tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-weight:bold;color:#888}
        .tab.active{color:#ff4444;border-bottom:2px solid #ff4444}
        .tab-content{display:none}
        .tab-content.active{display:block}
        
        textarea{min-height:180px;resize:vertical;font-family:monospace;font-size:13px;line-height:1.5;padding-right:14px}
        button{width:100%;padding:14px;background:#ff4444;color:#fff;font-weight:bold;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin-top:10px}
        .result{margin-top:20px;padding:20px;background:#d4edda;border-radius:10px;display:none}
        .link-out{background:#f8f9fa;padding:12px;border-radius:8px;margin-top:10px;word-break:break-all;font-size:13px}
        .note{margin-top:15px;color:#666;font-size:13px;text-align:center;line-height:1.6}
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 TẠO LINK SCRIPT</h1>

        <div class="pass-wrap">
            <input type="password" id="pass" placeholder="🔑 Mật khẩu quản lý">
            <button type="button" class="eye-btn" onclick="togglePass()">👁️</button>
        </div>

        <div class="check-row" onclick="toggleSave()">
            <input type="checkbox" id="savePass">
            <label for="savePass">💾 Lưu mật khẩu cho lần sau</label>
        </div>

        <input type="text" id="scriptName" placeholder="📝 Tên Script (vd: ATRAS | GIABÌNH)">

        <div class="tab-wrap">
            <div class="tab active" onclick="switchTab(1)">📋 Dán Script</div>
            <div class="tab" onclick="switchTab(2)">🔗 Dán Link</div>
        </div>

        <div class="tab-content active" id="tab1">
            <textarea id="scriptContent" placeholder="📝 Dán toàn bộ code/script Lua vào đây..."></textarea>
        </div>

        <div class="tab-content" id="tab2">
            <input type="text" id="scriptLink" placeholder="📎 Dán link script gốc / Passfy vào đây">
        </div>

        <button onclick="createLink()">✨ TẠO LINK DÙNG NGAY</button>

        <div class="result" id="resultBox">
            <strong>✅ Link tạo xong — Gửi cho mọi người thôi!</strong>
            <div class="link-out" id="newLink"></div>
            <button onclick="copyLink()" style="background:#2563eb">📋 Sao chép link nhiệm vụ</button>
            <div style="margin-top:12px;padding:10px;background:#eef2ff;border-radius:8px">
                <small style="color:#444">🔗 Trang lấy script:</small>
                <div class="link-out" id="scriptPageLink" style="margin:5px 0"></div>
            </div>
        </div>

        <p class="note">Người mở link → làm nhiệm vụ → nhận script ngay</p>
    </div>

<script>
const PASSWORD = "dobinhl12345";
let useContent = true;

// Tự điền MK nếu đã lưu
window.onload = function(){
    const saved = localStorage.getItem('savedPass');
    if(saved){
        document.getElementById('pass').value = saved;
        document.getElementById('savePass').checked = true;
    }
};

function togglePass(){
    const inp = document.getElementById('pass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
}

function toggleSave(){
    const cb = document.getElementById('savePass');
    cb.checked = !cb.checked;
    if(cb.checked){
        localStorage.setItem('savedPass', document.getElementById('pass').value);
    }else{
        localStorage.removeItem('savedPass');
    }
}

// Tự lưu khi nhập xong
document.getElementById('pass').addEventListener('input', function(){
    if(document.getElementById('savePass').checked){
        localStorage.setItem('savedPass', this.value);
    }
});

function switchTab(n){
    useContent = (n === 1);
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', i+1===n));
    document.querySelectorAll('.tab-content').forEach((t,i)=>t.classList.toggle('active', i+1===n));
}

function createLink(){
    const pass = document.getElementById('pass').value;
    if(pass !== PASSWORD) return alert("❌ Sai mật khẩu!");
    
    if(document.getElementById('savePass').checked){
        localStorage.setItem('savedPass', pass);
    }else{
        localStorage.removeItem('savedPass');
    }
    
    const name = document.getElementById('scriptName').value.trim();
    if(!name) return alert("❌ Nhập Tên Script!");

    const origin = window.location.origin;
    const path = window.location.pathname;
    const folder = path.substring(0, path.lastIndexOf('/') + 1);
    let finalScriptLink = "";

    if(useContent){
        const content = document.getElementById('scriptContent').value.trim();
        if(!content) return alert("❌ Dán nội dung Script vào!");
        const encoded = btoa(unescape(encodeURIComponent(content)));
        finalScriptLink = origin + folder + "getscript.html?data=" + encoded + "&name=" + encodeURIComponent(name);
    }else{
        const link = document.getElementById('scriptLink').value.trim();
        if(!link) return alert("❌ Dán link Script vào!");
        finalScriptLink = link;
    }

    const taskLink = origin + folder + "go.html?name=" + encodeURIComponent(name) + "&link=" + encodeURIComponent(finalScriptLink);
    
    document.getElementById('newLink').innerText = taskLink;
    document.getElementById('scriptPageLink').innerText = finalScriptLink;
    document.getElementById('resultBox').style.display = "block";
}

function copyLink(){
    navigator.clipboard.writeText(document.getElementById('newLink').innerText)
        .then(()=>alert("✅ Đã sao chép! Gửi đi thôi!"));
}
</script>
</body>
</html>
