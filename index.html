<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Tạo Link Script</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
        .container{max-width:460px;margin:0 auto}
        .card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
        .title{text-align:center;margin-bottom:25px}
        .title h2{font-size:22px;color:#333}
        
        .input-group{margin-bottom:15px}
        label{display:block;margin-bottom:6px;font-weight:bold;color:#444;font-size:14px}
        input, textarea{
            width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px;
        }
        textarea{min-height:140px;resize:vertical}
        
        .tabs{display:flex;margin-bottom:15px;border-bottom:2px solid #eee}
        .tab{padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent}
        .tab.active{border-bottom-color:#ff4444;color:#ff4444;font-weight:bold}
        
        button{
            width:100%;padding:16px;border:none;border-radius:12px;font-size:17px;font-weight:bold;
            cursor:pointer;transition:0.2s
        }
        .btn-create{background:linear-gradient(90deg,#ff4444,#ff9900);color:#fff;margin-top:10px}
        .btn-create:active{transform:scale(0.97)}
        
        .result{margin-top:20px;padding:15px;background:#f0fff4;border-radius:12px;display:none}
        .result.show{display:block}
        .link-box{background:#fff;padding:12px;border-radius:8px;word-break:break-all;margin:10px 0;border:1px solid #ddd;font-size:13px}
        .copy-btn{background:#5865f2;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;width:auto;border:none}
        
        .hint{font-size:13px;color:#888;margin-top:8px}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">
                <h2>🔐 TẠO LINK SCRIPT</h2>
            </div>

            <div class="input-group">
                <label>Mật khẩu quản lý</label>
                <input type="password" id="pass" placeholder="Nhập mật khẩu">
            </div>

            <div class="input-group">
                <label>Tên Script</label>
                <input type="text" id="scriptName" placeholder="VD: Lennon Hub...">
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('script')">📋 Dán Script</div>
                <div class="tab" onclick="switchTab('link')">🔗 Dán Link</div>
            </div>

            <div id="tabScript">
                <div class="input-group">
                    <label>Nội dung Script</label>
                    <textarea id="scriptContent" placeholder="Dán toàn bộ code script vào đây..."></textarea>
                </div>
                <p class="hint">💡 Tự mã hóa → link gọn không bị cắt</p>
            </div>

            <div id="tabLink" style="display:none">
                <div class="input-group">
                    <label>Link Script / Pastefy / Github</label>
                    <input type="url" id="directLink" placeholder="https://pastefy.app/... hoặc https://raw.githubusercontent.com/...">
                </div>
                <p class="hint">💡 Nhanh & ổn định nhất ✅</p>
            </div>

            <button class="btn-create" onclick="taoLink()">✨ TẠO LINK DÙNG NGAY</button>

            <div class="result" id="resultBox">
                <p style="font-weight:bold;color:#22c55e">✅ Tạo link thành công!</p>
                <div class="link-box" id="finalLink"></div>
                <button class="copy-btn" onclick="copyLink()">📋 Sao chép Link</button>
            </div>
        </div>
    </div>

<script>
const PASSWORD = "dobinhl12345";
const BASE_URL = window.location.origin + window.location.pathname.replace('index.html','go.html');

function switchTab(mode){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tabScript').style.display = mode==='script' ? 'block' : 'none';
    document.getElementById('tabLink').style.display = mode==='link' ? 'block' : 'none';
}

function taoLink(){
    const pass = document.getElementById('pass').value;
    if(pass !== PASSWORD){
        alert("❌ Sai mật khẩu!");
        return;
    }

    const name = encodeURIComponent(document.getElementById('scriptName').value.trim() || "Script");
    let finalLink = "";

    if(document.getElementById('tabScript').style.display !== 'none'){
        const scriptText = document.getElementById('scriptContent').value.trim();
        if(!scriptText){
            alert("⚠️ Chưa dán nội dung script!");
            return;
        }
        // Mã hóa Base64 → gọn link
        const encoded = btoa(unescape(encodeURIComponent(scriptText)));
        // ✅ ĐÚNG THỨ TỰ: name TRƯỚC, s SAU
        finalLink = `${BASE_URL}?name=${name}&s=${encoded}`;
    } else {
        const link = document.getElementById('directLink').value.trim();
        if(!link){
            alert("⚠️ Chưa nhập link!");
            return;
        }
        // ✅ ĐÚNG THỨ TỰ: name TRƯỚC, link SAU
        finalLink = `${BASE_URL}?name=${name}&link=${encodeURIComponent(link)}`;
    }

    document.getElementById('finalLink').innerText = finalLink;
    document.getElementById('resultBox').classList.add('show');
}

function copyLink(){
    const link = document.getElementById('finalLink').innerText;
    navigator.clipboard.writeText(link).then(()=>{
        alert("✅ Đã sao chép! Gửi cho mọi người thôi 😊");
    });
}
</script>
</body>
</html>
